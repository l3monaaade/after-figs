[package]
name = "motion-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Unified egui workspace combining FigCraft vector/layout design with EffectCraft timeline/compositing animation"

[dependencies]
motion-bridge.workspace = true
figcraft-doc.workspace = true
figcraft-geom.workspace = true
figcraft-color.workspace = true
figcraft-layout.workspace = true
figcraft-text.workspace = true
figcraft-engine.workspace = true
figcraft-ui-egui.workspace = true
effectcraft-time.workspace = true
effectcraft-project.workspace = true
effectcraft-text.workspace = true
effectcraft-render.workspace = true
effectcraft-engine.workspace = true
effectcraft-export.workspace = true
effectcraft-host.workspace = true
effectcraft-ui-egui.workspace = true
egui.workspace = true
eframe.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "Node",
    "Url",
    "Window",
] }
